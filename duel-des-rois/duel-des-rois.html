<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duel des Rois</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  :root{--red:#ff2240;--blue:#4f6dff}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;overflow:hidden;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #flash{position:fixed;inset:0;opacity:0;pointer-events:none;background:#fff;z-index:5}
  #fade{position:fixed;inset:0;opacity:0;pointer-events:none;background:#000;z-index:6;transition:opacity 1.5s}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.8) 100%)}
  .bar{position:fixed;left:0;right:0;height:9vh;background:#000;z-index:4}
  #barT{top:0} #barB{bottom:0}

  #banner{position:fixed;left:0;right:0;top:18vh;z-index:7;text-align:center;pointer-events:none;opacity:0}
  #banner .k{font-size:clamp(40px,8vw,96px);font-weight:900;letter-spacing:.15em;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill}
  #banner .f{font-family:Bangers,Impact,sans-serif;font-size:clamp(20px,3.4vw,40px);letter-spacing:.2em;margin-top:4px;color:#fff}
  #banner.show{animation:bIn 2.4s ease forwards}
  @keyframes bIn{0%{opacity:0;transform:scale(1.8);filter:blur(10px)}10%{opacity:1;transform:scale(1);filter:blur(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.04)}}

  #sub{position:fixed;left:0;right:0;bottom:11vh;z-index:7;text-align:center;pointer-events:none;padding:0 16px;font-size:clamp(16px,2.4vw,24px);
    text-shadow:0 2px 0 #000,0 0 10px #000;opacity:0;transition:opacity .3s}
  #sub b{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.1em;margin-right:10px}
  #sub.show{opacity:1}
  #cap{position:fixed;left:0;right:0;top:13vh;z-index:7;text-align:center;pointer-events:none;font-size:clamp(16px,2.6vw,26px);letter-spacing:.4em;
    color:#dfe8ff;text-shadow:0 0 12px #6d8cff;opacity:0;transition:opacity .6s;font-style:italic}
  #cap.show{opacity:1}

  .nm{position:fixed;bottom:13vh;z-index:7;pointer-events:none;opacity:0;transition:opacity .8s,transform .8s}
  .nm .n{font-family:Bangers,Impact,sans-serif;font-size:clamp(28px,5vw,58px);letter-spacing:.08em;line-height:1}
  .nm .t{font-size:clamp(11px,1.5vw,15px);letter-spacing:.3em;text-transform:uppercase;opacity:.85}
  #nA{left:5vw;transform:translateX(-40px)} #nA .n{color:var(--red);text-shadow:0 0 18px rgba(255,34,64,.7),3px 3px 0 #000}
  #nB{right:5vw;text-align:right;transform:translateX(40px)} #nB .n{color:var(--blue);text-shadow:0 0 18px rgba(79,109,255,.7),3px 3px 0 #000}
  .nm.show{opacity:1;transform:none}

  #start,#end{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:16px;text-align:center;
    background:radial-gradient(circle at 25% 50%,rgba(255,34,64,.25),transparent 45%),radial-gradient(circle at 75% 50%,rgba(79,109,255,.25),transparent 45%),#050308;transition:opacity .7s}
  #start.hide{opacity:0;pointer-events:none}
  .vs{display:flex;align-items:center;gap:clamp(12px,4vw,48px);flex-wrap:wrap;justify-content:center}
  .vs .c{font-family:Bangers,Impact,sans-serif;font-size:clamp(34px,7vw,80px);letter-spacing:.06em;line-height:1}
  .vs .c small{display:block;font-family:system-ui,sans-serif;font-size:clamp(10px,1.4vw,14px);letter-spacing:.3em;opacity:.8;margin-top:6px}
  .vs .a{color:var(--red);text-shadow:0 0 24px rgba(255,34,64,.8),4px 4px 0 #000}
  .vs .b{color:var(--blue);text-shadow:0 0 24px rgba(79,109,255,.8),4px 4px 0 #000}
  .vs .x{font-family:Bangers,Impact,sans-serif;font-size:clamp(40px,8vw,90px);color:#fff;font-style:italic;text-shadow:0 0 20px #fff}
  h2.tt{font-size:clamp(14px,2vw,18px);letter-spacing:.6em;color:#bbb;font-weight:400}
  button.go{font-family:Bangers,Impact,sans-serif;font-size:clamp(22px,4vw,32px);letter-spacing:.12em;padding:14px 36px;color:#fff;background:#0a0306;
    border:2px solid #fff;border-radius:4px;cursor:pointer;box-shadow:-8px 0 30px rgba(255,34,64,.6),8px 0 30px rgba(79,109,255,.6);transition:transform .15s}
  button.go:hover{transform:scale(1.06)}
  .hint{color:#99a;font-size:14px;letter-spacing:.06em}
  #end{opacity:0;pointer-events:none;background:#000}
  #end.show{opacity:1;pointer-events:auto}
  #end .fin{font-family:Bangers,Impact,sans-serif;font-size:clamp(60px,14vw,160px);letter-spacing:.2em;color:#fff;text-shadow:-6px 0 30px rgba(255,34,64,.8),6px 0 30px rgba(79,109,255,.8)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<div class="bar" id="barT"></div><div class="bar" id="barB"></div>
<div id="flash"></div>
<div id="banner"><div class="k"></div><div class="f"></div></div>
<div id="cap"></div>
<div id="sub"></div>
<div class="nm" id="nA"><div class="n">KUROGANE</div><div class="t">Le Roi Écarlate</div></div>
<div class="nm" id="nB"><div class="n">SHIRANUI</div><div class="t">La Tempête d'Azur</div></div>
<div id="fade"></div>

<div id="start">
  <h2 class="tt">覇 王 の 決 闘</h2>
  <div class="vs">
    <div class="c a">KUROGANE<small>Le Roi Écarlate</small></div>
    <div class="x">VS</div>
    <div class="c b">SHIRANUI<small>La Tempête d'Azur</small></div>
  </div>
  <button class="go" id="go">⚔ Commencer le duel</button>
  <div class="hint">🔊 Monte le son · plein écran conseillé (F11) · ~50 secondes</div>
</div>
<div id="end">
  <div class="fin">FIN</div>
  <button class="go" id="again">↻ Revoir le duel</button>
</div>

<script>
(() => {
'use strict';
/* ======================================================================
   OUTILS
   ====================================================================== */
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const bf = document.createElement('canvas'), bctx = bf.getContext('2d');
let W, H, dpr;
function resize(){
  dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
  cv.width = bf.width = W*dpr; cv.height = bf.height = H*dpr;
}
addEventListener('resize', resize); resize();

const rand = (a = 1, b) => b === undefined ? Math.random()*a : a + Math.random()*(b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a)*t;
const pick = a => a[(Math.random()*a.length) | 0];
const TAU = Math.PI*2, R = Math.PI/180;
const JPF = '"Hiragino Kaku Gothic Pro","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif';
function seeded(s){ return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0)/4294967296; }; }
const EASE = {
  lin: p => p,
  in: p => p*p*p,
  out: p => 1 - Math.pow(1 - p, 3),
  inOut: p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2,
  back: p => 1 + 2.7*Math.pow(p - 1, 3) + 1.7*Math.pow(p - 1, 2),
  snap: p => p >= 1 ? 1 : 1 - Math.pow(2, -10*p),
};

/* ======================================================================
   HORLOGES + TWEENS
   ====================================================================== */
const S = { dir:0, world:0, slow:1, frozen:false, flash:0, flashCol:'#fff', speed:0, sky:0, started:false, ended:false,
  mtnCut:null, moonCut:null, splits:[], tsRing:null, panels:null, hakiClash:null, lockSparks:false, windMul:1 };
const clk = c => c === 'dir' ? S.dir : S.world;
const TW = [];
function tw(o, k, to, dur, ease = 'inOut', c = 'world'){
  for (let i = TW.length - 1; i >= 0; i--) if (TW[i].o === o && TW[i].k === k) TW.splice(i, 1);
  if (!(dur > 0)){ o[k] = to; return; }
  TW.push({ o, k, f:o[k], to, t0:clk(c), dur, e:EASE[ease] || EASE.inOut, c });
}
function twKill(o){ for (let i = TW.length - 1; i >= 0; i--) if (TW[i].o === o) TW.splice(i, 1); }
function updTw(){
  for (let i = TW.length - 1; i >= 0; i--){
    const w = TW[i], p = clamp((clk(w.c) - w.t0)/w.dur, 0, 1);
    w.o[w.k] = w.f + (w.to - w.f)*w.e(p);
    if (p >= 1) TW.splice(i, 1);
  }
}

/* ======================================================================
   AUDIO — 100 % synthétisé (Web Audio)
   ====================================================================== */
let AC = null, master, verb, WHITE, BROWN, DIST, windG;
function initAudio(){
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const comp = AC.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 6; comp.attack.value = .003; comp.release.value = .25;
  master = AC.createGain(); master.gain.value = .9; master.connect(comp); comp.connect(AC.destination);
  const sr = AC.sampleRate;
  WHITE = AC.createBuffer(1, sr*2, sr); { const d = WHITE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  BROWN = AC.createBuffer(1, sr*4, sr); { const d = BROWN.getChannelData(0); let l = 0; for (let i = 0; i < d.length; i++){ l = (l + .02*(Math.random()*2 - 1))/1.02; d[i] = l*3.5; } }
  const IR = AC.createBuffer(2, sr*3, sr);
  for (let c = 0; c < 2; c++){ const d = IR.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2 - 1)*Math.pow(1 - i/d.length, 2.5); }
  verb = AC.createConvolver(); verb.buffer = IR; const vg = AC.createGain(); vg.gain.value = .45; verb.connect(vg); vg.connect(master);
  DIST = new Float32Array(1024); for (let i = 0; i < 1024; i++){ const x = i/512 - 1; DIST[i] = 31*x/(1 + 30*Math.abs(x)); }
  // vent ambiant
  const n = nsrc(WHITE); n.loop = true;
  const bp = filt('bandpass', 450, .6), lfo = AC.createOscillator(), lg = AC.createGain();
  lfo.frequency.value = .13; lg.gain.value = 250; lfo.connect(lg); lg.connect(bp.frequency);
  windG = AC.createGain(); windG.gain.value = .0001;
  n.connect(bp); bp.connect(windG); out(windG, .2); n.start(); lfo.start();
}
function out(node, wet = .3){ node.connect(master); if (wet){ const g = AC.createGain(); g.gain.value = wet; node.connect(g); g.connect(verb); } }
const nsrc = b => { const s = AC.createBufferSource(); s.buffer = b; return s; };
const filt = (type, f, q = 1) => { const b = AC.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; };
const T0 = () => AC.currentTime + .004;
function env(g, at, a, peak, d){ g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(Math.max(.0002, peak), at + a); g.gain.exponentialRampToValueAtTime(.0001, at + a + d); }
function osc(type, f, at, dur, peak, a = .003, wet = .3, f2){
  const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, at);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, at + dur*.8);
  const g = AC.createGain(); env(g, at, a, peak, dur); o.connect(g); out(g, wet); o.start(at); o.stop(at + a + dur + .05);
}
function noise(buf, at, dur, peak, type, f, q = 1, wet = .3, a = .002, f2){
  const n = nsrc(buf); n.loop = true; const fl = filt(type, f, q);
  if (f2){ fl.frequency.setValueAtTime(f, at); fl.frequency.exponentialRampToValueAtTime(f2, at + dur); }
  const g = AC.createGain(); env(g, at, a, peak, dur); n.connect(fl); fl.connect(g); out(g, wet); n.start(at); n.stop(at + a + dur + .05);
}
const A_ = fn => (...a) => { if (AC && !S.mute) fn(...a); };
const sfx = {
  clang: A_((v = .6, p = 1) => {
    const at = T0();
    [[1, .5, 1.8], [1.52, .35, 1.3], [2.23, .3, 1.1], [2.87, .22, .9], [3.91, .15, .7], [5.1, .1, .5]]
      .forEach(([r, g, d]) => osc('sine', 820*p*r*rand(.99, 1.01), at, d, v*g, .002, .45));
    noise(WHITE, at, .06, v*.9, 'highpass', 3000, 1, .3, .001);
    osc('sine', 200, at, .18, v*.7, .002, .1, 60);
  }),
  whoosh: A_((v = .4, dur = .25, f0 = 400, f1 = 2600) => noise(WHITE, T0(), dur, v, 'bandpass', f0, 1.2, .2, dur*.3, f1)),
  tp: A_(() => { const at = T0(); osc('sine', 2600, at, .14, .22, .002, .3, 250); noise(WHITE, at, .05, .4, 'highpass', 2500, 1, .2, .001); noise(WHITE, at, .3, .25, 'bandpass', 3000, 1, .2, .02, 500); }),
  taiko: A_((v = 1) => { const at = T0(); osc('sine', 150, at, .9, v, .004, .6, 50); noise(BROWN, at, .15, v*.7, 'lowpass', 700, 1, .5, .002); }),
  heart: A_((v = 1) => { const at = T0(); osc('sine', 95, at, .42, v, .006, .15, 36); osc('sine', 95, at + .2, .42, v*.55, .006, .15, 36); }),
  boom: A_((s = 1) => {
    const at = T0();
    osc('sine', 120, at, 2.6*s, 1.3*s, .005, .25, 26);
    const n = nsrc(BROWN), lp = filt('lowpass', 4000); lp.frequency.setValueAtTime(4000, at); lp.frequency.exponentialRampToValueAtTime(80, at + 2.2);
    const ws = AC.createWaveShaper(); ws.curve = DIST; const g = AC.createGain(); env(g, at, .004, 1.1*s, 3*s);
    n.connect(lp); lp.connect(ws); ws.connect(g); out(g, .55); n.start(at); n.stop(at + 3.5);
    noise(WHITE, at, .14, .9*s, 'highpass', 1200, 1, .4, .001);
  }),
  zap: A_((v = .4, pan = 0) => {
    const at = T0(); let dest;
    if (AC.createStereoPanner){ dest = AC.createStereoPanner(); dest.pan.value = clamp(pan, -1, 1); } else dest = AC.createGain();
    out(dest, .25); let s = at; const c = 3 + (Math.random()*5 | 0);
    for (let i = 0; i < c; i++){
      const n = nsrc(WHITE), bp = filt('bandpass', rand(1200, 5200), 1.2), g = AC.createGain();
      env(g, s, .001, v*rand(.4, 1), rand(.02, .09)); n.connect(bp); bp.connect(g); g.connect(dest); n.start(s, rand(1.5), .15);
      s += rand(.015, .06);
    }
    const o = AC.createOscillator(); o.type = 'square'; o.frequency.value = rand(50, 120);
    const lp = filt('lowpass', 900), g = AC.createGain(); env(g, at, .002, v*.15, .16); o.connect(lp); lp.connect(g); g.connect(dest); o.start(at); o.stop(at + .25);
  }),
  rumble: A_((v = .8, dur = 3) => {
    const at = T0(), n = nsrc(BROWN); n.loop = true; const lp = filt('lowpass', 110), g = AC.createGain();
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v, at + Math.min(.6, dur*.3));
    g.gain.setValueAtTime(v, at + dur*.7); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    n.connect(lp); lp.connect(g); out(g, .2); n.start(at); n.stop(at + dur + .1);
  }),
  grind: A_((dur = 1.8) => {
    const at = T0(), g = AC.createGain();
    g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.22, at + .05); g.gain.setValueAtTime(.22, at + dur - .1); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    [2600, 4300, 6100].forEach(f => { const n = nsrc(WHITE); n.loop = true; const bp = filt('bandpass', f, 12); n.connect(bp); bp.connect(g); n.start(at); n.stop(at + dur + .05); });
    const tr = AC.createOscillator(); tr.frequency.value = 17; const tg = AC.createGain(); tg.gain.value = .1; tr.connect(tg); tg.connect(g.gain); tr.start(at); tr.stop(at + dur);
    out(g, .3);
  }),
  tick: A_(() => { const at = T0(); osc('square', 2000, at, .03, .12, .001, .7); osc('square', 1400, at + .06, .03, .06, .001, .7); }),
  chin: A_(() => { const at = T0(); [2900, 4400, 6300].forEach((f, i) => { osc('sine', f, at, .6 - i*.12, .2/(i + 1), .001, .6); osc('sine', f*1.01, at + .07, .4, .08/(i + 1), .001, .6); }); noise(WHITE, at, .03, .3, 'highpass', 5000, 1, .3, .001); }),
  sheathe: A_((dur = .8) => { const at = T0(); const n = nsrc(WHITE); n.loop = true; const bp = filt('bandpass', 4500, 3), g = AC.createGain(); g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.12, at + dur); g.gain.linearRampToValueAtTime(.0001, at + dur + .02); n.connect(bp); bp.connect(g); out(g, .3); n.start(at); n.stop(at + dur + .1); }),
  draw: A_(() => { const at = T0(); noise(WHITE, at, .35, .25, 'bandpass', 3000, 4, .5, .01, 8000); osc('sine', 3300, at + .05, .8, .06, .01, .7, 3600); }),
  shatter: A_(() => { const at = T0(); for (let i = 0; i < 16; i++) osc('sine', rand(3000, 8000), at + rand(.25), rand(.08, .25), rand(.04, .1), .001, .5); noise(WHITE, at, .35, .35, 'highpass', 4000, 1, .4, .001); }),
  suck: A_((dur = .8) => { const at = T0(); const n = nsrc(WHITE); n.loop = true; const bp = filt('bandpass', 250, 1.4); bp.frequency.setValueAtTime(250, at); bp.frequency.exponentialRampToValueAtTime(5000, at + dur); const g = AC.createGain(); g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.5, at + dur); g.gain.linearRampToValueAtTime(.0001, at + dur + .03); n.connect(bp); bp.connect(g); out(g, .35); n.start(at); n.stop(at + dur + .1); }),
  doon: A_(() => { const at = T0(); osc('sine', 55, at, 3, .9, .01, 1); osc('sine', 110, at, 2, .25, .01, 1); }),
  tinnitus: A_((dur) => { const at = T0(); const o = AC.createOscillator(); o.frequency.value = 2800; const g = AC.createGain(); g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(.02, at + .5); g.gain.setValueAtTime(.02, at + dur - .1); g.gain.linearRampToValueAtTime(.0001, at + dur); o.connect(g); out(g, .4); o.start(at); o.stop(at + dur + .05); }),
  drone: A_((dur = 3, v = .22) => {
    const at = T0(), g = AC.createGain(); g.gain.setValueAtTime(.0001, at); g.gain.exponentialRampToValueAtTime(v, at + .6); g.gain.setValueAtTime(v, at + dur - .5); g.gain.exponentialRampToValueAtTime(.0001, at + dur);
    const lp = filt('lowpass', 500, 4); lp.frequency.setValueAtTime(300, at); lp.frequency.exponentialRampToValueAtTime(2200, at + dur*.8);
    [41.2, 41.6, 58.3, 82.4].forEach(f => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(at); o.stop(at + dur + .05); });
    lp.connect(g); out(g, .4);
  }),
};
function setWind(v, t = 1){ if (AC) windG.gain.setTargetAtTime(Math.max(.0001, v), AC.currentTime, t/3); }
let lastZap = 0;
function zapT(v, pan){ const n = performance.now(); if (n - lastZap < 70) return; lastZap = n; sfx.zap(v, pan); }

/* ======================================================================
   PERSONNAGES — squelette articulé (cinématique directe + IK)
   ====================================================================== */
const L = { torso:60, neck:9, head:15, ua:34, fa:32, th:46, sh:46, blade:112, hilt:24, foot:15 };
const DEF_POSE = { T:4, H:0, fs:0, fe:20, ns:10, ne:30, w:0, fh:-8, fk:-4, nh:8, nk:-6 };
const POSES = {
  stand:     { T:4, ns:20, ne:70, w:40, two:1, fh:-8, fk:-4, nh:10, nk:-10 },
  low:       { T:3, ns:15, ne:25, w:10, fs:-8, fe:15, fh:-8, fk:-3, nh:8, nk:-6 },
  sheathIdle:{ T:3, sheath:1, grip:1, fh:-8, fk:-3, nh:8, nk:-6 },
  guard:     { T:10, H:-5, ns:30, ne:65, w:35, two:1, fh:-28, fk:-10, nh:30, nk:-35 },
  iaiReady:  { T:28, H:-18, sheath:1, grip:1, fh:-40, fk:-25, nh:50, nk:-75 },
  iaiDraw:   { T:15, H:-8, ns:130, ne:10, w:10, fs:-30, fe:30, fh:-40, fk:-8, nh:50, nk:-60 },
  dash:      { T:45, H:-30, ns:-50, ne:-20, w:-30, fs:-50, fe:20, fh:-50, fk:-40, nh:60, nk:-60 },
  windHigh:  { T:-5, H:5, ns:170, ne:10, w:10, two:1, fh:-30, fk:-8, nh:30, nk:-30 },
  cutDown:   { T:30, H:-10, ns:80, ne:10, w:-20, two:1, fh:-40, fk:-5, nh:55, nk:-60 },

function ik(S0, T, a, b){

  const e2 = [S0[0] + Math.cos(base - A)*a, S0[1] + Math.sin(base - A)*a];
  return [e1[1] > e2[1] ? e1 : e2, [S0[0] + Math.cos(base)*d, S0[1] + Math.sin(base)*d]];

class Chain {
  constructor(n, len, w0, w1, col, edge){ Object.assign(this, { n, len, w0, w1, col, edge, p:[], q:[], init:false, free:false }); }
  place(x, y){ this.p = []; this.q = []; for (let i = 0; i < this.n; i++){ this.p.push([x, y + i*this.len]); this.q.push([x, y + i*this.len]); } this.init = true; }

    if (!this.init || (!this.free && Math.hypot(anc[0] - this.p[0][0], anc[1] - this.p[0][1]) > 150)) this.place(anc[0], anc[1]);
    if (dt <= 0) return;

      const p = this.p[i], q = this.q[i], vx = (p[0] - q[0])*.965, vy = (p[1] - q[1])*.965;
      q[0] = p[0]; q[1] = p[1];
      const k = .4 + i/this.n, fl = Math.sin(S.world*9 + i*1.3 + this.len)*.5 + 1;
      p[0] += vx + ax*dt*dt*k*fl; p[1] += vy + ay*dt*dt;

    }
    for (let it = 0; it < 4; it++) for (let i = 1; i < this.n; i++){

    for (let i = 0; i < n; i++){
      const a = P[Math.max(0, i - 1)], b = P[Math.min(n - 1, i + 1)];
      let tx = b[0] - a[0], ty = b[1] - a[1]; const d = Math.hypot(tx, ty) || 1; tx /= d; ty /= d;

    for (let i = 1; i < n; i++) ctx.lineTo(lf[i][0], lf[i][1]);
    for (let i = n - 1; i >= 0; i--) ctx.lineTo(rt[i][0], rt[i][1]);
    ctx.closePath();
    if (!sil){ ctx.lineJoin = 'round'; ctx.strokeStyle = '#07060a'; ctx.lineWidth = 4; ctx.stroke(); }
    ctx.fillStyle = sil || this.col; ctx.fill();
    if (!sil && this.edge){ ctx.strokeStyle = this.edge; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(rt[0][0], rt[0][1]); for (let i = 1; i < n; i++) ctx.lineTo(rt[i][0], rt[i][1]); ctx.stroke(); }
  }
}

class Fighter {

  pl([P(-13, -6), P(-8, -14), P(4, -15), P(13, -7), P(15, 2), P(13, 6), P(9, 13), P(0, 15), P(-10, 9)]); ctx.closePath();
  if (!sil){ ctx.strokeStyle = OUT; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.fillStyle = sil || d.skin; ctx.fill();
  // cheveux
  if (isA){
    poly([P(-16, 10), P(-20, -2), P(-14, -14), P(-4, -21), P(8, -19), P(16, -12), P(19, -4), P(10, -8), P(12, 0), P(4, -9), P(-2, -4), P(-6, 4), P(-12, 2)], d.hair, sil, 2.5);
  } else {
    poly([P(-16, 8), P(-22, -4), P(-16, -12), P(-20, -22), P(-8, -18), P(-4, -28), P(4, -19), P(12, -24), P(12, -14), P(20, -10), P(12, -8), P(14, -2), P(6, -6), P(0, -3), P(-6, 5)], d.hair, sil, 2.5);
    dot(P(-12, -18), 5, d.hair, sil);
    if (!sil){ ctx.strokeStyle = d.trim; ctx.lineWidth = 4; pl([P(-14, -8), P(14, -6)]); ctx.stroke(); }
  }
  if (sil) return;
  // oeil
  const e = P(8, -1), glow = F ? F.aura : 0;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2.2; pl([P(4, -3), P(12, -2)]); ctx.stroke();
  if (glow > .25){ ctx.save(); ctx.shadowColor = d.aura; ctx.shadowBlur = 14; ctx.fillStyle = '#fff'; }
  else ctx.fillStyle = d.eye;
  ctx.beginPath(); ctx.arc(e[0], e[1], 2.2, 0, TAU); ctx.fill();
  if (glow > .25) ctx.restore();
  // sourcil froncé
  ctx.lineWidth = 2.5; pl([P(3, -7), P(12, -4)]); ctx.stroke();
  if (isA){ ctx.strokeStyle = '#8a1a24'; ctx.lineWidth = 1.6; pl([P(5, -10), P(10, 6)]); ctx.stroke(); }
  // bouche
  ctx.strokeStyle = '#3a2020'; ctx.lineWidth = 1.5; pl([P(8, 8), P(12, 8)]); ctx.stroke();
}
function drawSword(sk, d, sil, F){
  const g = sk.guard, t = sk.tip, sd = sk.sd, arm = F ? F.arm : 0;
  // poignée
  limb([sk.hiltEnd, g], 6, d.hilt, sil);
  if (!sil){ ctx.fillStyle = '#ddd'; for (let i = 1; i < 4; i++){ const q = lerp2(sk.hiltEnd, g, i/4); ctx.fillRect(q[0] - 1, q[1] - 1, 2, 2); } }
  const n = [-sd[1], sd[0]];
  limb([add(g, n, -8), add(g, n, 8)], 4, d.tsuba, sil);
  if (sk.sheath) return;
  // lame (légèrement courbée)
  const m = lerp2(g, t, .5), k = sk.f;
  ctx.beginPath(); ctx.moveTo(...add(g, n, 2.6*k)); ctx.quadraticCurveTo(...add(m, n, 6*k), t[0], t[1]);
  ctx.quadraticCurveTo(...add(m, n, 1.2*k), ...add(g, n, -2.4*k)); ctx.closePath();
  if (sil){ ctx.fillStyle = sil; ctx.fill(); return; }
  if (arm > .5){
    ctx.save(); ctx.shadowColor = d.aura; ctx.shadowBlur = 18; ctx.fillStyle = '#050507'; ctx.fill(); ctx.restore();
    ctx.strokeStyle = d.aura; ctx.lineWidth = 1.4; ctx.stroke();
  } else {
    ctx.fillStyle = '#dfe6ef'; ctx.fill(); ctx.strokeStyle = '#555c68'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(...add(g, n, -1.2*k)); ctx.quadraticCurveTo(...add(m, n, 1.5*k), t[0], t[1]); ctx.stroke();
  }
  if (sk.broken){ ctx.fillStyle = '#dfe6ef'; pl([add(t, n, 3), add(t, sd, 6), add(t, n, -3)]); ctx.fill(); }
}
function drawTrail(F){
  const tr = F.trail; if (tr.length < 2) return;
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < tr.length - 1; i++){
    const a = tr[i], b = tr[i + 1], sp = Math.min(a.s, b.s);
    if (sp < 700) continue;
    const al = Math.min(1, (sp - 700)/1400)*(1 - a.age/.16);
    ctx.fillStyle = `rgba(${F.d.rgb},${.55*al})`;
    pl([a.b, a.t, b.t, b.b]); ctx.closePath(); ctx.fill();
    ctx.fillStyle = `rgba(255,255,255,${.75*al})`;
    pl([lerp2(a.b, a.t, .55), a.t, b.t, lerp2(b.b, b.t, .55)]); ctx.closePath(); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

const FX = { parts:[], bolts:[], rings:[], ghosts:[], crescents:[], waves:[], cracks:[], txt:[], streaks:[] };
let windT = 0;
const WIND = () => 160 + 120*Math.sin(windT*.7) + 80*Math.sin(windT*2.3);

function buildBolt(x, y, a, len, w, depth, paths){
  const pts = [[x, y]], n = Math.max(4, len/16 | 0), st = len/n; let px = x, py = y, an = a;
  for (let i = 0; i < n; i++){
    an += (Math.random() - .5)*1.1; an = a + clamp(an - a, -.9, .9);
    px += Math.cos(an)*st; py += Math.sin(an)*st; pts.push([px, py]);
    if (depth > 0 && Math.random() < .2) buildBolt(px, py, an + (Math.random() < .5 ? -1 : 1)*rand(.4, 1.1), len*rand(.25, .55)*(1 - i/n), w*.6, depth - 1, paths);
  }
  paths.push({ pts, w });
}
function bolt(x, y, a, len, w, life, rgb = '255,34,64'){
  if (FX.bolts.length > 90) return;
  const paths = []; buildBolt(x, y, a, len, w, 2, paths); FX.bolts.push({ paths, life, max:life, rgb });
}
function ring(x, y, v, w, life, rgb = '255,255,255', flat = false){ FX.rings.push({ x, y, r:6, v, w, life, max:life, rgb, flat }); }
function sparks(x, y, n, cols = ['#fff', '#ffe7a0', '#ffc060']){
  for (let i = 0; i < n; i++){ const a = rand(TAU), v = rand(200, 1200); FX.parts.push({ k:'spark', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 150, life:rand(.15, .5), max:.5, col:pick(cols), g:900 }); }
}
function dustBurst(x, n, sp = 400){
  for (let i = 0; i < n; i++){ const s = rand(-1, 1); FX.parts.push({ k:'dust', x:x + rand(-30, 30), y:-rand(2, 20), vx:s*rand(100, sp), vy:-rand(20, 160), life:rand(.8, 1.8), max:1.8, size:rand(16, 40) }); }
}
function rocks(x, n, sp = 700, float = false){
  for (let i = 0; i < n; i++){
    const pts = [], m = 5 + (Math.random()*3 | 0), s = rand(4, 13);
    for (let j = 0; j < m; j++) pts.push([Math.cos(j/m*TAU)*s*rand(.6, 1.2), Math.sin(j/m*TAU)*s*rand(.6, 1.2)]);
    const r = { k:'rock', x:x + rand(-30, 30), y:-rand(2, 10), vx:rand(-1, 1)*sp*.6, vy:-rand(.3, 1)*sp, rot:rand(TAU), vr:rand(-8, 8), pts, life:4, max:4, g:1400 };
    if (float){ r.float = true; r.x = x; r.ty = -rand(20, 200); r.vx = 0; r.vy = 0; r.ph = rand(TAU); r.g = 0; r.life = 99; }
    FX.parts.push(r);
  }

function crack(x, dir, len, rgb){
  const pts = [[x, 0]]; let px = x, py = 0;
  while (Math.abs(px - x) < len){ px += dir*rand(15, 40); py = rand(-2, 30); pts.push([px, py]); }
  FX.cracks.push({ pts, glow:1, rgb });
}
function sfxText(txt, sx, sy, size = 70, col = '#fff', rot = rand(-.25, .25), life = .9){ FX.txt.push({ txt, x:sx, y:sy, size, col, rot, life, max:life }); }
function flash(v = 1, col = '#fff'){ S.flash = Math.max(S.flash, v); S.flashCol = col; }
function impact(big){
  const seq = big

const baseFilter = () => S.frozen ? 'grayscale(1) brightness(1.9) contrast(1.15)' : '';

const cam = { x:0, y:-600, zoom:.8, rot:0, mode:'manual', shake:0, zmul:1, sx:0, sy:0 };
const BASE = () => Math.min(W/1300, H/760);
function w2s(x, y){
  const z = BASE()*cam.zoom, dx = (x - cam.x)*z, dy = (y - cam.y)*z, c = Math.cos(cam.rot), s = Math.sin(cam.rot);
  return [W/2 + dx*c - dy*s + cam.sx, H/2 + dx*s + dy*c + cam.sy];
}
function applyCam(p = 1){
  const z = BASE()*cam.zoom*(.3 + .7*p);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(W/2 + cam.sx*p, H/2 + cam.sy*p); ctx.rotate(cam.rot*p); ctx.scale(z, z); ctx.translate(-cam.x*p, -cam.y*p);
  return z;
}
function camTo(x, y, z, r, dur, e = 'inOut'){ cam.mode = 'manual'; tw(cam, 'x', x, dur, e, 'dir'); tw(cam, 'y', y, dur, e, 'dir'); tw(cam, 'zoom', z, dur, e, 'dir'); tw(cam, 'rot', r, dur, e, 'dir'); }
function camCut(x, y, z, r = 0){ cam.mode = 'manual'; twKill(cam); Object.assign(cam, { x, y, zoom:z, rot:r }); }
function camAuto(zmul = 1){ cam.mode = 'auto'; cam.zmul = zmul; tw(cam, 'rot', 0, .5, 'out', 'dir'); }

const rs = seeded(7);
const FAR = [], HILL = [], GRASS = [], STARS = [], CLOUDS = [];
for (let x = -4200; x <= 4200; x += 70) FAR.push([x, -(260 + 120*Math.sin(x*.0021) + 80*Math.sin(x*.0053 + 1) + 40*Math.sin(x*.013))]);
for (let x = -3200; x <= 3200; x += 60) HILL.push([x, -(70 + 40*Math.sin(x*.004 + 2) + 25*Math.sin(x*.011))]);
for (let x = -3000; x <= 3000; x += 14 + rs()*18) GRASS.push([x, 6 + rs()*14, rs()*.6 - .3]);
for (let i = 0; i < 160; i++) STARS.push([rs(), rs()*.7, rs()*1.4 + .3, rs()*TAU]);
for (let i = 0; i < 7; i++) CLOUDS.push([-2400 + i*800 + rs()*300, -1100 - rs()*500, 500 + rs()*600, 40 + rs()*50]);
const PEAK = [[-1700, 400], [-1500, -120], [-1320, -260], [-1150, -420], [-1020, -560], [-920, -700], [-860, -660], [-800, -740], [-700, -560], [-560, -430], [-420, -300], [-250, -150], [-80, 0], [0, 400]];

function drawSky(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#04030a'); g.addColorStop(.55, '#150d22'); g.addColorStop(1, '#2a1628');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS){
    const a = .4 + .6*Math.abs(Math.sin(S.dir*.8 + s[3]));
    ctx.fillStyle = `rgba(255,255,255,${a*.8})`;
    ctx.fillRect((s[0]*W*1.4 - cam.x*.01*BASE() + W*2) % (W*1.2) - W*.1, s[1]*H - cam.y*.02*BASE(), s[2], s[2]);
  }
  // ciel coupé par les deux haki
  if (S.sky > .01){
    const seam = w2s(0, 0), hz = seam[1], sx = seam[0], a = S.sky;
    let gr = ctx.createLinearGradient(0, 0, 0, hz);
    gr.addColorStop(0, `rgba(255,20,50,${.55*a})`); gr.addColorStop(1, `rgba(90,0,20,${.2*a})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, sx, H);
    gr = ctx.createLinearGradient(0, 0, 0, hz);
    gr.addColorStop(0, `rgba(60,90,255,${.55*a})`); gr.addColorStop(1, `rgba(10,20,90,${.2*a})`);
    ctx.fillStyle = gr; ctx.fillRect(sx, 0, W - sx, H);
    // couture de foudre noire
    const pts = []; for (let y = -10; y < hz; y += 18) pts.push([sx + rand(-22, 22)*a, y]);
    ctx.lineJoin = 'round'; ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `rgba(255,255,255,${.25*a})`; ctx.lineWidth = 26; pl(pts); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = `rgba(0,0,0,${a})`; ctx.lineWidth = 9; pl(pts); ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${.8*a})`; ctx.lineWidth = 1.5; pl(pts); ctx.stroke();
  }
}
function halfClip(cx, cy, ang, side){
  const L2 = 6000, ca = Math.cos(ang), sa = Math.sin(ang), nx = -sa*side, ny = ca*side;
  ctx.beginPath(); ctx.moveTo(cx - ca*L2, cy - sa*L2); ctx.lineTo(cx + ca*L2, cy + sa*L2);
  ctx.lineTo(cx + ca*L2 + nx*L2, cy + sa*L2 + ny*L2); ctx.lineTo(cx - ca*L2 + nx*L2, cy - sa*L2 + ny*L2); ctx.closePath(); ctx.clip();
}
function drawBackground(){
  drawSky();
  // lune
  applyCam(.03);
  const mc = S.moonCut, mx = 520, my = -700, mr = 170;
  const moon = (dx, dy) => {
    ctx.fillStyle = S.sky > .3 ? '#ffd9dc' : '#f1e8e2';
    ctx.beginPath(); ctx.arc(mx + dx, my + dy, mr, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(160,140,150,.25)';
    [[-60, -40, 50], [70, 30, 36], [-10, 90, 28], [90, -90, 22]].forEach(([a, b, r]) => { ctx.beginPath(); ctx.arc(mx + dx + a, my + dy + b, r, 0, TAU); ctx.fill(); });
  };
  let g = ctx.createRadialGradient(mx, my, mr*.8, mx, my, mr*3);
  g.addColorStop(0, 'rgba(255,230,230,.25)'); g.addColorStop(1, 'rgba(255,230,230,0)');
  ctx.fillStyle = g; ctx.fillRect(mx - mr*3, my - mr*3, mr*6, mr*6);
  if (mc){
    const p = EASE.out(clamp((S.dir - mc.t0)/3, 0, 1)), d = p*40, ang = -.45, ca = Math.cos(ang), sa = Math.sin(ang);
    ctx.save(); halfClip(mx, my, ang, 1); moon(ca*d, sa*d); ctx.restore();
    ctx.save(); halfClip(mx, my, ang, -1); moon(-ca*d, -sa*d); ctx.restore();
    const gl = 1 - clamp((S.dir - mc.t0)/2, 0, 1);
    ctx.strokeStyle = `rgba(255,255,255,${gl})`; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(mx - ca*mr*1.6, my - sa*mr*1.6); ctx.lineTo(mx + ca*mr*1.6, my + sa*mr*1.6); ctx.stroke();
  } else moon(0, 0);
  // nuages
  applyCam(.06);
  ctx.fillStyle = 'rgba(40,24,50,.55)';
  for (const c of CLOUDS){ const x = ((c[0] + S.dir*12 + 3000) % 6000) - 3000; ctx.beginPath(); ctx.ellipse(x, c[1], c[2], c[3], 0, 0, TAU); ctx.fill(); }
  // montagnes lointaines
  applyCam(.15);
  ctx.fillStyle = '#120c1a'; pl([[-4200, 3000], ...FAR, [4200, 3000]]); ctx.closePath(); ctx.fill();
  // grand pic (peut être tranché)
  applyCam(.3);
  const peak = (dx, dy, rot) => {
    ctx.save(); ctx.translate(dx, dy); if (rot) { ctx.translate(-860, -500); ctx.rotate(rot); ctx.translate(860, 500); }
    ctx.fillStyle = '#261a33'; pl(PEAK); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(210,200,230,.16)'; pl([[-1020, -560], [-920, -700], [-860, -660], [-800, -740], [-700, -560], [-760, -600], [-860, -590], [-940, -620]]); ctx.closePath(); ctx.fill();
    ctx.restore();
  };
  const mt = S.mtnCut;
  if (mt){
    const p = EASE.inOut(clamp((S.dir - mt.t0)/3, 0, 1)), ang = .32, cx = -880, cy = -470, ca = Math.cos(ang), sa = Math.sin(ang);
    ctx.save(); halfClip(cx, cy, ang, 1); peak(0, 0, 0); ctx.restore();
    ctx.save(); halfClip(cx, cy, ang, -1); peak(ca*p*420, sa*p*420 + p*p*160, p*.16); ctx.restore();
    const gl = 1 - clamp((S.dir - mt.t0)/1.5, 0, 1);
    if (gl > 0){ ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(255,60,80,${gl})`; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(cx - ca*900, cy - sa*900); ctx.lineTo(cx + ca*900, cy + sa*900); ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
  } else peak(0, 0, 0);
  // collines
  applyCam(.55);
  ctx.fillStyle = '#130d18'; pl([[-3200, 3000], ...HILL, [3200, 3000]]); ctx.closePath(); ctx.fill();
}
function drawGround(){
  const g = ctx.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, '#1d1519'); g.addColorStop(1, '#060407');
  ctx.fillStyle = g; ctx.fillRect(cam.x - 5000, 0, 10000, 3000);
  ctx.strokeStyle = 'rgba(255,220,230,.07)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cam.x - 5000, 0); ctx.lineTo(cam.x + 5000, 0); ctx.stroke();
  ctx.strokeStyle = '#0c090e'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const sw = Math.sin(S.world*2)*.15;
  for (const [x, h, l] of GRASS){ if (Math.abs(x - cam.x) > 2200) continue; ctx.beginPath(); ctx.moveTo(x, 1); ctx.lineTo(x + (l + sw)*h, -h); ctx.stroke(); }

    ctx.lineJoin = 'miter';
    if (c.glow > 0){ ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${c.rgb},${.6*c.glow})`; ctx.lineWidth = 9; pl(c.pts); ctx.stroke(); ctx.globalCompositeOperation = 'source-over'; }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 3; pl(c.pts); ctx.stroke();
  }
}

/* ======================================================================
   ACTEURS + FEUILLE
   ====================================================================== */
const A = new Fighter(DA, -330, 1), B = new Fighter(DB, 330, -1);
A.to('low', 0); B.to('sheathIdle', 0);
const LEAF = { on:false, t:0, x:0, y:-470, rot:0 };

/* ======================================================================
   MISE À JOUR
   ====================================================================== */
function step(rdt){
  S.dir += rdt;
  while (EVI < EV.length && EV[EVI].t <= S.dir){ EV[EVI].fn(); EVI++; }
  const wdt = S.frozen ? 0 : rdt*S.slow;
  S.world += wdt; windT += wdt;
  updTw();
  A.update(wdt); B.update(wdt);
  // caméra auto : suit les deux combattants
  if (cam.mode === 'auto'){
    const mx = (A.x + B.x)/2, dx = Math.abs(A.x - B.x), my = Math.min(A.y, B.y);
    const tz = clamp(1050/(dx + 480), .7, 1.9)*cam.zmul, k = 1 - Math.exp(-rdt*5);
    cam.x += (mx - cam.x)*k; cam.y += (-125 + my*.6 - cam.y)*k; cam.zoom += (tz - cam.zoom)*k;
  }
  cam.shake *= Math.pow(.01, rdt);
  const sh = cam.shake + (S.hakiClash ? 7 : 0);
  cam.sx = rand(-sh, sh); cam.sy = rand(-sh, sh);
  S.flash *= Math.pow(.004, rdt); S.speed *= Math.pow(.15, rdt);
  // feuille du duel
  if (LEAF.on && wdt > 0){ LEAF.t += wdt; LEAF.x = -20 + 45*Math.sin(LEAF.t*2.4); LEAF.y = Math.min(-3, -470 + 235*LEAF.t); LEAF.rot = LEAF.y < -3 ? LEAF.t*3.2 : LEAF.rot; }
  // effets du monde
  if (wdt > 0){
    for (const p of FX.parts){
      p.life -= wdt;
      if (p.k === 'rock' && p.float){ p.y += (p.ty - p.y)*(1 - Math.exp(-wdt*1.2)); p.y += Math.sin(S.world*2 + p.ph)*.3; p.rot += wdt*.5; continue; }
      if (p.k === 'flame'){ p.x += p.vx*wdt; p.y += p.vy*wdt; p.vy *= Math.pow(.6, wdt); continue; }
      if (p.k === 'dust'){ p.x += p.vx*wdt; p.y += p.vy*wdt; p.vx *= Math.pow(.2, wdt); p.vy *= Math.pow(.2, wdt); p.size += wdt*18; continue; }
      if (p.k === 'leaf'){ p.x += (p.vx + WIND()*.6*S.windMul)*wdt; p.y += p.vy*wdt; p.rot += p.vr*wdt; p.x += Math.sin(S.world*2 + p.ph)*.8; if (p.y > -2){ p.y = -2; p.vx = 0; p.vr = 0; } continue; }
      p.vy += (p.g || 0)*wdt; p.x += p.vx*wdt; p.y += p.vy*wdt;
      if (p.k === 'spark'){ p.vx *= Math.pow(.3, wdt); }
      if (p.rot !== undefined) p.rot += (p.vr || 0)*wdt;
      if ((p.k === 'rock' || p.k === 'shard') && p.y > -2){ p.y = -2; p.vy *= -.35; p.vx *= .6; p.vr *= .5; }
    }
    FX.parts = FX.parts.filter(p => p.life > 0);
    FX.bolts = FX.bolts.filter(b => (b.life -= wdt) > 0);
    FX.rings = FX.rings.filter(r => { r.r += r.v*wdt; r.v *= Math.pow(.25, wdt); return (r.life -= wdt) > 0; });
    FX.ghosts = FX.ghosts.filter(g => (g.life -= wdt) > 0);
    FX.streaks = FX.streaks.filter(s => (s.life -= wdt) > 0);
    FX.crescents = FX.crescents.filter(c => { c.x += (c.vx || 0)*wdt; c.y += (c.vy || 0)*wdt; c.r += (c.vr || 0)*wdt; return (c.life -= wdt) > 0; });
    FX.waves = FX.waves.filter(w => {
      w.x += w.vx*wdt; w.life -= wdt;

function segI(a, b, c, d){
  const r = [b[0] - a[0], b[1] - a[1]], s = [d[0] - c[0], d[1] - c[1]], den = r[0]*s[1] - r[1]*s[0];

}
function clashPoint(){

  return [x, y];
}

function drawBolts(){
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const b of FX.bolts){
    if (Math.random() < .12 && !S.frozen) continue;
    const a = clamp(b.life/b.max*1.4, 0, 1);
    ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = `rgba(${b.rgb},${.22*a})`;
    for (const p of b.paths){ ctx.lineWidth = p.w*6; pl(p.pts); ctx.stroke(); }
    ctx.globalCompositeOperation = 'source-over'; ctx.strokeStyle = `rgba(${b.rgb},${a})`;
    for (const p of b.paths){ ctx.lineWidth = p.w*2.4; pl(p.pts); ctx.stroke(); }
    ctx.strokeStyle = `rgba(0,0,0,${a})`;
    for (const p of b.paths){ ctx.lineWidth = p.w*1.1; pl(p.pts); ctx.stroke(); }
  }
}
function drawParts(front){

      case 'flame':
        if (front !== p.dark) break;
        ctx.globalCompositeOperation = p.dark ? 'source-over' : 'lighter';
        ctx.fillStyle = `rgba(${p.rgb},${(p.dark ? .5 : .55)*a})`;
        ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size*.45*a + 1, p.size*(1.3 - a*.4), Math.atan2(p.vx, -p.vy), 0, TAU); ctx.fill();

      case 'spark':
        if (!front) break;
        ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = p.col; ctx.globalAlpha = a; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx*.025, p.y - p.vy*.025); ctx.stroke();
        ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; break;
      case 'dust':

      case 'rock': case 'shard':

        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life);
        pl(p.pts); ctx.closePath(); ctx.fillStyle = p.k === 'shard' ? '#e8eef5' : '#2a2230'; ctx.fill();
        ctx.strokeStyle = p.k === 'shard' ? '#fff' : '#08060a'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.restore(); break;
      case 'leaf':
        if (!front) break;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.life*.5);
        ctx.fillStyle = p.col; ctx.beginPath(); ctx.ellipse(0, 0, 6, 2.6, 0, 0, TAU); ctx.fill(); ctx.restore(); break;

}
function drawRings(){

}
function drawCrescent(c){

function drawScreenFX(){

function applySplits(){
  for (const s of S.splits){
    const p = (S.dir - s.t0)/s.dur, d = p < .18 ? 0 : s.amp*Math.sin(Math.PI*(p - .18)/.82), gl = p < .18 ? p/.18 : 1 - (p - .18)/.82;
    bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, bf.width, bf.height); bctx.drawImage(cv, 0, 0);

function drawPanels(lt){
  const e = EASE.out(clamp(lt/.35, 0, 1)), ex = lt > 2.7 ? EASE.in(clamp((lt - 2.7)/.3, 0, 1)) : 0;
  ctx.fillStyle = `rgba(0,0,0,${.92*(1 - ex)})`; ctx.fillRect(0, 0, W, H);
  const ph = H*.3, gap = H*.03;

function panel(d, ox, y, h, lt){
  const isA = d.id === 'A', r = seeded(isA ? 3 : 9);
  ctx.save(); ctx.translate(ox, 0); ctx.beginPath(); ctx.rect(10, y, W - 20, h); ctx.clip();
  ctx.fillStyle = d.skin; ctx.fillRect(0, y, W, h);
  let g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(0,0,0,.6)'); g.addColorStop(.45, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.35)');

    const cx = W/2 + s*W*.17, eh = ew*.34;
    const lid = new Path2D();
    lid.moveTo(cx - ew/2, cy + eh*.1*s); lid.quadraticCurveTo(cx - ew*.1*s, cy - eh*1.5, cx + ew/2, cy - eh*.3*s);
    lid.quadraticCurveTo(cx, cy + eh*1.1, cx - ew/2, cy + eh*.1*s);
    ctx.save(); ctx.clip(lid);
    ctx.fillStyle = '#f4efee'; ctx.fillRect(cx - ew, cy - ew, ew*2, ew*2);
    const ir = eh*1.05, ix = cx + look*ew*.12;
    const ig = ctx.createRadialGradient(ix, cy, ir*.1, ix, cy, ir);
    ig.addColorStop(0, '#000'); ig.addColorStop(.3, d.aura); ig.addColorStop(.8, isA ? '#5a0010' : '#101c5a'); ig.addColorStop(1, '#000');
    ctx.fillStyle = ig; ctx.beginPath(); ctx.arc(ix, cy, ir, 0, TAU); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(ix, cy, ir*.18, ir*.6, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.95)'; ctx.beginPath(); ctx.arc(ix - ir*.35, cy - ir*.35, ir*.14, 0, TAU); ctx.fill();
    g = ctx.createLinearGradient(0, cy - eh*1.5, 0, cy); g.addColorStop(0, 'rgba(0,0,0,.7)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - ew, cy - eh*2, ew*2, eh*2);
    ctx.restore();
    ctx.strokeStyle = '#000'; ctx.lineWidth = eh*.28; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx - ew/2 - 4, cy + eh*.1*s); ctx.quadraticCurveTo(cx - ew*.1*s, cy - eh*1.55, cx + ew/2 + 6, cy - eh*.3*s); ctx.stroke();

    ctx.lineWidth = eh*.4; ctx.beginPath(); ctx.moveTo(cx - s*ew*.55, cy - eh*2.6); ctx.lineTo(cx + s*ew*.5, cy - eh*1.7); ctx.stroke();
    if (glow > 0){
      ctx.globalCompositeOperation = 'lighter';
      const gg = ctx.createRadialGradient(ix, cy, 0, ix, cy, ew*1.3);
      gg.addColorStop(0, `rgba(${d.rgb},${glow})`); gg.addColorStop(1, `rgba(${d.rgb},0)`);
      ctx.fillStyle = gg; ctx.fillRect(ix - ew*1.3, cy - ew*1.3, ew*2.6, ew*2.6);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  if (isA){ ctx.strokeStyle = '#8a1a24'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(W/2 + W*.13, cy - ew*.55); ctx.lineTo(W/2 + W*.2, cy + ew*.45); ctx.stroke(); }

  for (let i = 0; i < 9; i++){
    const x = W*(.08 + i*.105) + r()*40, w = W*.07 + r()*W*.05, hh = h*(.28 + r()*.25);
    ctx.beginPath(); ctx.moveTo(x - w/2, y - 5); ctx.lineTo(x + w/2, y - 5); ctx.lineTo(x + (r() - .5)*w, y + hh); ctx.closePath(); ctx.fill(); ctx.stroke();

  ctx.globalCompositeOperation = 'source-over';
  ctx.restore();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(ox + 10, y, W - 20, h);
}

/* ======================================================================
   BOUCLE
   ====================================================================== */
let last = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const rdt = Math.min(.05, (now - last)/1000); last = now;
  if (S.started && !S.ended) step(rdt);
  else { A.sk = A.skel(); B.sk = B.skel(); }
  render();
}
function render(){
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  drawBackground();
  drawWorld();
  drawScreenFX();
  applySplits();
  $('flash').style.opacity = S.flash; $('flash').style.background = S.flashCol;
}
requestAnimationFrame(frame);

$('go').addEventListener('click', () => {
  $('start').classList.add('hide');
  initAudio(); AC.resume();
  S.started = true;
});
$('again').addEventListener('click', () => location.reload());
// pour tester : saute directement à un instant
window.__skip = t => { S.mute = true; while (S.dir < t) step(1/60); S.mute = false; };
})();
